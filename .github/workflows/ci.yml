name: CI

"on":
  push:
  pull_request:

jobs:
  smoke-test:
    name: Import smoke test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # win_amd64 / manylinux x86_64 are the two platforms this add-on
        # bundles compiled binaries for (see BUILD.md). 3.9 represents
        # Splunk 9.x's bundled runtime; 3.12/3.13 represent Splunk 10.x's
        # -- and the pre-3.12 vs 3.12+ split matters here specifically
        # because of the splunklib.six meta-path shim in oci_logging.py
        # (PEP 451 stopped invoking find_module-only finders in 3.12).
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run vendored bin/lib import + functional smoke tests
        run: python -m unittest tests.test_bin_lib_imports -v
